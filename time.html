<!DOCTYPE html>
<html>
<head>
    <title>Trilaterasi + Waktu Tempuh</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f2f5;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 420px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        canvas {
            border: 1px solid black;
            background: #fafafa;
        }

        input {
            padding: 5px;
            margin: 5px;
            width: 80px;
        }

        button {
            padding: 8px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .hasil {
            margin-top: 10px;
            font-weight: bold;
            text-align: left;
        }

        .waktu {
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>📍 Trilaterasi + Waktu Tempuh</h2>

    <div class="waktu">🕒 Waktu Sekarang: <span id="jam"></span></div>

    X: <input type="number" id="x" value="150">
    Y: <input type="number" id="y" value="150"><br>

    Kecepatan (m/s): <input type="number" id="v" value="1"><br>

    <button onclick="hitung()">Hitung</button>

    <div class="hasil" id="hasil"></div>
    <div class="waktu" id="waktuKlik"></div>
</div>

<canvas id="canvas" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// titik referensi
const A = {x: 50, y: 80};
const B = {x: 300, y: 100};
const C = {x: 200, y: 300};

// jam real-time
function updateJam() {
    let now = new Date();
    document.getElementById("jam").innerHTML = now.toLocaleTimeString();
}
setInterval(updateJam, 1000);

// rumus jarak
function jarak(p1, p2) {
    return Math.sqrt(
        Math.pow(p1.x - p2.x, 2) +
        Math.pow(p1.y - p2.y, 2)
    );
}

// gambar titik
function gambarTitik(p, warna, label) {
    ctx.fillStyle = warna;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, 2 * Math.PI);
    ctx.fill();
    ctx.fillText(label, p.x + 8, p.y);
}

// gambar lingkaran
function gambarLingkaran(p, r, warna) {
    ctx.strokeStyle = warna;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, 2 * Math.PI);
    ctx.stroke();
}

// fungsi utama
function hitung() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let now = new Date();
    document.getElementById("waktuKlik").innerHTML =
        "⏰ Waktu perhitungan: " + now.toLocaleString();

    let x = parseFloat(document.getElementById("x").value);
    let y = parseFloat(document.getElementById("y").value);
    let v = parseFloat(document.getElementById("v").value);

    let P = {x: x, y: y};

    let r1 = jarak(P, A);
    let r2 = jarak(P, B);
    let r3 = jarak(P, C);

    // ubah ke meter (simulasi)
    let s1 = r1 * 1000;
    let s2 = r2 * 1000;
    let s3 = r3 * 1000;

    // waktu (detik)
    let t1 = s1 / v;
    let t2 = s2 / v;
    let t3 = s3 / v;

    // menit
    let m1 = t1 / 60;
    let m2 = t2 / 60;
    let m3 = t3 / 60;

    document.getElementById("hasil").innerHTML =
        `🔴 Titik A <br>
         📏 Jarak: ${r1.toFixed(2)} <br>
         ⏱ Waktu: ${t1.toFixed(2)} detik (${m1.toFixed(2)} menit)<br><br>

         🟢 Titik B <br>
         📏 Jarak: ${r2.toFixed(2)} <br>
         ⏱ Waktu: ${t2.toFixed(2)} detik (${m2.toFixed(2)} menit)<br><br>

         🔵 Titik C <br>
         📏 Jarak: ${r3.toFixed(2)} <br>
         ⏱ Waktu: ${t3.toFixed(2)} detik (${m3.toFixed(2)} menit)`;

    // gambar
    gambarTitik(A, "red", "A");
    gambarTitik(B, "green", "B");
    gambarTitik(C, "blue", "C");

    gambarLingkaran(A, r1, "red");
    gambarLingkaran(B, r2, "green");
    gambarLingkaran(C, r3, "blue");

    gambarTitik(P, "black", "P");
}
</script>

</body>
</html>
