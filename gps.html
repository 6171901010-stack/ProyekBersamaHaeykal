<!DOCTYPE html>
<html>
<head>
    <title>GPS Tracker Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        #map {
            height: 100vh;
        }

        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 1000;
            width: 250px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button {
            padding: 10px;
            width: 100%;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="info">
    <h3>📍 GPS Tracker</h3>
    <button onclick="getLocation()">Ambil Lokasi</button>
    <div id="output"></div>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    let map = L.map('map').setView([-6.9, 107.6], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map'
    }).addTo(map);

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(showPosition);
        } else {
            alert("GPS tidak didukung");
        }
    }

    function showPosition(position) {
        let lat = position.coords.latitude;
        let lon = position.coords.longitude;

        map.setView([lat, lon], 15);

        // Marker kamu
        L.marker([lat, lon]).addTo(map)
            .bindPopup("📍 Lokasi Saya")
            .openPopup();

        // Buat 3 titik random sekitar (radius kecil)
        let titik = [
            [lat + 0.002, lon + 0.002],
            [lat - 0.002, lon + 0.001],
            [lat + 0.001, lon - 0.002]
        ];

        let hasil = "<b>Jarak ke titik:</b><br>";

        titik.forEach((t, index) => {
            L.marker(t).addTo(map)
                .bindPopup("Titik " + (index + 1));

            let jarak = hitungJarak(lat, lon, t[0], t[1]);

            hasil += "Titik " + (index + 1) + ": " + jarak.toFixed(2) + " km<br>";
        });

        document.getElementById("output").innerHTML = hasil;
    }

    function hitungJarak(lat1, lon1, lat2, lon2) {
        const R = 6371;
        let dLat = (lat2 - lat1) * Math.PI / 180;
        let dLon = (lon2 - lon1) * Math.PI / 180;

        let a =
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) *
            Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);

        let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

        return R * c;
    }
</script>

</body>
</html>
